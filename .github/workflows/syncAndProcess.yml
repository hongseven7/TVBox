name: Sync and Process

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update?'
        type: boolean
        default: false
        required: true

jobs:
  sync-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPSTREAM_URL: https://github.com/yoursmile66/TVBox.git
      TARGET_BRANCH: main
      SCRIPTS_DIR: .github/scripts
      FORCE_UPDATE: ${{ github.event.inputs.force_update }}      

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check for Upstream Changes
        id: check          
        run: |
          git remote add upstream $UPSTREAM_URL
          git fetch upstream

          # Count commits that upstream has but we don't
          CHANGES=$(git rev-list HEAD..upstream/$TARGET_BRANCH --count)

          if [ "$CHANGES" -gt "0" ]; then
            echo "Upstream has $CHANGES new commits."
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          elif [ "$FORCE_UPDATE" = "true" ]; then
            echo "Forcing update."
            echo "HAS_CHANGES=true" >> $GITHUB_ENV          
          else
            echo "Upstream is already synced."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Merge Upstream (No Commit)
        if: env.HAS_CHANGES == 'true'
        run: |
          # --no-commit: Stages changes but waits for you to finalize the commit
          # --no-ff: Forces a merge commit (keeps history clear)
          # -X theirs: Auto-resolves conflicts by favoring upstream
          git merge upstream/$TARGET_BRANCH --strategy-option=theirs --allow-unrelated-histories --no-commit --no-ff
          
      - name: Download External File
        if: env.HAS_CHANGES == 'true'
        run: |
          FILE_URL="https://jihulab.com/yoursmile2/TVBox/-/raw/master/custom_spider.jar"
          
          echo "Downloading $FILE_URL"
          curl -O --output-dir . "$FILE_URL"

      - name: Set up Python
        if: env.HAS_CHANGES == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        if: env.HAS_CHANGES == 'true'
        run: |
          if [ -f $SCRIPTS_DIR/requirements.txt ]; then pip install -r $SCRIPTS_DIR/requirements.txt; fi

      - name: Run Script and Commit
        if: env.HAS_CHANGES == 'true'
        run: |
          # 1. Run the script (modifies files in place)
          python $SCRIPTS_DIR/processContent.py .
          
          # 2. Add any new changes generated by the script
          git add .
          
          # 3. Finalize the single commit
          # Because a merge is pending (MERGE_HEAD exists), git knows this is a merge commit
          git commit -m "Sync and Process"
          
          # 4. Push everything at once
          git push origin $TARGET_BRANCH
